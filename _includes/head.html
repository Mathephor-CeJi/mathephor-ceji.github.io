<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.url == '/' or page.url == '/zh/' %}{% if page.lang == 'zh' %}{{ site.title_zh }}{% else %}{{ site.title }}{% endif %}{% else %}{{ page.title }} | {% if page.lang == 'zh' %}{{ site.title_zh }}{% else %}{{ site.title }}{% endif %}{% endif %}</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/icon.png' | relative_url }}" type="image/png">
  <link rel="shortcut icon" href="{{ '/assets/icon.ico' | relative_url }}" type="image/x-icon">
  <link rel="alternate" hreflang="{% if page.lang == 'zh' %}zh-CN{% else %}en-US{% endif %}" href="{{ page.url | absolute_url }}">
  <link rel="alternate" hreflang="{% if page.lang == 'zh' %}en-US{% else %}zh-CN{% endif %}" href="{{ page.alternate_url | absolute_url }}">
</head>
