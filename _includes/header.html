{% if page.lang == "zh" %}
  {% assign home_url = "/zh/" %}
{% else %}
  {% assign home_url = "/" %}
{% endif %}
<header class="site-header">
  <a class="site-brand" href="{{ home_url | relative_url }}">{{ t.site_title }}</a>
  <nav class="site-nav" aria-label="{{ t.navigation }}">
    {% for item in site.data.navigation %}
      {% assign localized_item = item[page.lang] %}
      <a class="nav-link{% if page.url == localized_item.url %} is-current{% endif %}" href="{{ localized_item.url | relative_url }}"{% if page.url == localized_item.url %} aria-current="page"{% endif %}>{{ localized_item.label }}</a>
    {% endfor %}
    <a class="language-switch" href="{{ page.alternate_url | relative_url }}" lang="{% if page.lang == 'zh' %}en{% else %}zh-CN{% endif %}">{{ t.language_switch }}</a>
  </nav>
</header>
