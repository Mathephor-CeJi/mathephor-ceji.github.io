---
layout: default
---

<article class="content-section post">
  <header class="post-header">
    <h1 class="section-heading">{{ page.title }}</h1>
    <p class="post-date">{% if page.lang == 'zh' %}{{ page.date | date: "%Y年%-m月%-d日" }}{% else %}{{ page.date | date: "%B %-d, %Y" }}{% endif %}</p>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
