---
layout: default
---

<section class="home-intro" aria-labelledby="about-heading">
  <div class="home-copy">
    <h1 id="about-heading" class="home-heading">{{ t.about }}</h1>
    {{ content }}
  </div>
  <figure class="portrait">
    <img src="{{ '/assets/img/bern.jpg' | relative_url }}" alt="{{ t.portrait_alt }}">
  </figure>
</section>

{% include publications.html featured=true %}

<section class="content-section" aria-labelledby="updates-heading">
  <h2 id="updates-heading" class="section-heading">{{ t.updates }}</h2>
  {% assign localized_posts = site.posts | where: "lang", page.lang %}
  <div class="update-list">
    {% for post in localized_posts %}
      <p><a href="{{ post.url | relative_url }}">{{ post.title }}</a> — {{ post.date | date: t.date_format }}</p>
    {% endfor %}
  </div>
</section>
