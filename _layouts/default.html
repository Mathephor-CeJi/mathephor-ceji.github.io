<!doctype html>
{% if page.lang == "zh" %}
  {% assign t = site.data.ui.zh %}
{% else %}
  {% assign t = site.data.ui.en %}
{% endif %}
<html lang="{{ t.locale }}">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main-content">{{ t.skip_to_content }}</a>
    <div class="site-shell">
      {% include header.html %}
      <main id="main-content">
        {{ content }}
      </main>
      {% include footer.html %}
    </div>
  </body>
</html>
